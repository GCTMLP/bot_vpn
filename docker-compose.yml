services:

  bot_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lipa
      POSTGRES_PASSWORD: Md5(kbgfpsrf)
      POSTGRES_DB: bot_vpn
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d bot_vpn -U lipa"]
      interval: 30s
      timeout: 10s
      retries: 5

  bot_db_init:
    build: bot
    command: alembic upgrade head
    depends_on:
      bot_db:
        condition: service_healthy

  bot:
    build: bot
    command: python src/main.py
    restart: always
    volumes:
      - ./bot/keys:/code/keys
      - ./bot/src:/code/src
    depends_on:
      bot_db_init:
        condition: service_completed_successfully

volumes:
  pgdata: